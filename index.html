<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clareira de outono</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading" role="status">Carregando a clareira…</div>

    <aside class="panel">
      <p class="kicker">Mapa · clareira de outono</p>
      <h1>Raposa</h1>
      <div class="actions" role="group" aria-label="Ações da raposa">
        <button type="button" data-clip="survey" aria-pressed="false">
          Observar <kbd>1</kbd>
        </button>
        <button type="button" data-clip="walk" aria-pressed="false">
          Caminhar <kbd>2</kbd>
        </button>
        <button type="button" data-clip="run" aria-pressed="false">
          Correr <kbd>3</kbd>
        </button>
      </div>
      <p class="hint">Arraste para orbitar. A roda aproxima a câmera.</p>
      <p class="credits">
        Raposa de
        <a href="https://sketchfab.com/3d-models/low-poly-fox-by-pixelmannen-animated-371dea88d7e04a76af5763f2a36866bc">PixelMannen e tomkranis</a>
        no Sketchfab (modelo CC0, rig e animações CC BY 4.0, glTF por Asobo Studio e scurest).
        Céu
        <a href="https://polyhaven.com/a/autumn_meadow">Autumn Meadow</a>
        de Sergej Majboroda, Poly Haven (CC0).
      </p>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
